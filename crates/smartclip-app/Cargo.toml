[package]
name = "smartclip-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
smartclip-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `protocol-asset` autorise la vue à lire un fichier local : c'est ce qui permet
# au lecteur d'ouvrir un clip depuis le disque, dans les limites du `scope`
# déclaré dans tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# Notification système à la sauvegarde : l'utilisateur joue en plein écran et ne
# doit pas avoir à ouvrir la fenêtre pour savoir que son clip est pris.
tauri-plugin-notification = "2"
# Une seule instance : deux applications lancées, ce sont deux buffers qui
# capturent l'écran en parallèle.
tauri-plugin-single-instance = "2"

# Media Foundation doit être démarré pour toute la vie de l'application, pas
# seulement pendant que le moteur tourne.
[dependencies.windows]
workspace = true
features = ["Win32_Media_MediaFoundation", "Win32_System_Com"]

[[bin]]
name = "smartclip-studio"
path = "src/main.rs"

[package]
name = "smartclip-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
smartclip-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Encodage des vignettes. Sans dependance native, quelques dizaines de Ko.
png = "0.17"
tracing.workspace = true
tracing-subscriber.workspace = true
# La macro #[implement] génère du code référençant `windows_core` par son nom
# de crate : dépendance directe obligatoire.
windows-core.workspace = true
# Attente des operations WinRT de la reconnaissance vocale.
windows-future = "0.3"
windows-collections = "0.3"

[dependencies.windows]
workspace = true
features = [
    "Foundation",
    # Reconnaissance vocale hors ligne pour la phrase d'activation.
    "Media_SpeechRecognition",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    # PKEY_Device_FriendlyName : le nom lisible d'un périphérique audio.
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    # IPropertyStore, pour lire le nom d'un périphérique audio.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]
